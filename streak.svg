<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 170" width="1092" height="170" role="img" aria-label="Frank Patel's GitHub Streak">
  <title>Frank Patel's GitHub Streak</title>
  <defs>
    <style><![CDATA[
      text { font-family: 'Space Grotesk', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes flamePulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(244,114,182,.8)); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 14px rgba(34,211,238,.9)); } }
      @keyframes shineX { 0% { transform: translateX(-200px) skewX(-15deg); } 60%, 100% { transform: translateX(1300px) skewX(-15deg); } }
      .flame { transform-origin: center; animation: flamePulse 2s ease-in-out infinite; transform-box: fill-box; }
      .sh { animation: shineX 5s ease-in-out 1s infinite; }
    ]]></style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#151628"/>
    </linearGradient>

    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16182a"/>
      <stop offset="100%" stop-color="#101120"/>
    </linearGradient>

    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1a32"/>
      <stop offset="100%" stop-color="#131428"/>
    </linearGradient>

    <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".04"/>
    </pattern>

    <clipPath id="tc">
      <rect x="0" y="0" width="1092" height="170" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="1092" height="170" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1092" height="170" rx="16" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1091" height="169" rx="16" fill="none" stroke="url(#grad)" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- ==================== CELL 1: TOTAL CONTRIBUTIONS ==================== -->
  <g transform="translate(14, 14)">
    <rect width="344" height="142" rx="14" fill="url(#cardGrad)" stroke="#7dd3fc" stroke-opacity=".4" stroke-width="1.2"/>
    <text x="32" y="36" font-size="22">📅</text>
    <text class="m" x="62" y="34" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="2">TOTAL CONTRIBUTIONS</text>
    <text class="m" x="172" y="86" text-anchor="middle" font-size="38" font-weight="800" fill="#f4f5fb">650+</text>
    <text class="s" x="172" y="112" text-anchor="middle" font-size="12.5" fill="#8e91ab">Consistent Year-Round Velocity</text>
    <rect x="28" y="126" width="288" height="4" rx="2" fill="#1b1c30"/>
    <rect x="28" y="126" width="288" height="4" rx="2" fill="#7dd3fc"/>
  </g>

  <!-- ==================== CELL 2: CURRENT STREAK (HERO) ==================== -->
  <g transform="translate(374, 14)">
    <rect width="344" height="142" rx="14" fill="url(#centerGrad)" stroke="#f472b6" stroke-opacity=".65" stroke-width="1.5"/>
    <text class="flame" x="32" y="36" font-size="24">🔥</text>
    <text class="m" x="64" y="34" font-size="12" font-weight="800" fill="#f472b6" letter-spacing="2">CURRENT STREAK</text>
    <text class="m" x="172" y="86" text-anchor="middle" font-size="38" font-weight="800" fill="#22d3ee">Active Daily</text>
    <text class="s" x="172" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f472b6">Shipping Code &amp; Automating</text>
    <rect x="28" y="126" width="288" height="4" rx="2" fill="#1b1c30"/>
    <rect x="28" y="126" width="288" height="4" rx="2" fill="url(#grad)"/>
  </g>

  <!-- ==================== CELL 3: LONGEST STREAK ==================== -->
  <g transform="translate(734, 14)">
    <rect width="344" height="142" rx="14" fill="url(#cardGrad)" stroke="#fde047" stroke-opacity=".4" stroke-width="1.2"/>
    <text x="32" y="36" font-size="22">⚡</text>
    <text class="m" x="62" y="34" font-size="12" font-weight="700" fill="#fde047" letter-spacing="2">LONGEST STREAK</text>
    <text class="m" x="172" y="86" text-anchor="middle" font-size="38" font-weight="800" fill="#f4f5fb">64 Days</text>
    <text class="s" x="172" y="112" text-anchor="middle" font-size="12.5" fill="#8e91ab">Sustained Commit Focus</text>
    <rect x="28" y="126" width="288" height="4" rx="2" fill="#1b1c30"/>
    <rect x="28" y="126" width="288" height="4" rx="2" fill="#fde047"/>
  </g>

  <!-- Light Sweep Effect -->
  <g clip-path="url(#tc)">
    <rect class="sh" x="0" y="0" width="160" height="170" fill="url(#shg)"/>
  </g>
</svg>
