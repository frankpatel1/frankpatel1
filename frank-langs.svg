<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Frank Patel's Top Languages">
  <title>Frank Patel's Top Languages</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap');
      .s { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes shineX { 0% { transform: translateX(-180px) skewX(-15deg); } 60%, 100% { transform: translateX(750px) skewX(-15deg); } }
      .shimmer { animation: shineX 5s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#151628"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="600" height="340" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="599" height="339" rx="18" fill="none" stroke="url(#grad)" stroke-opacity=".4" stroke-width="1.2"/>

  <!-- Window Header -->
  <rect width="600" height="42" rx="18" fill="#211b38" fill-opacity=".5"/>
  <rect y="32" width="600" height="10" fill="#211b38" fill-opacity=".5"/>
  <circle cx="26" cy="21" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="21" r="5" fill="#febc2e"/>
  <circle cx="58" cy="21" r="5" fill="#28c840"/>
  <text x="76" y="25" class="m" font-size="12" font-weight="700" fill="#a78bfa" letter-spacing="2">📊 MOST USED LANGUAGES &amp; STACK</text>

  <!-- Consolidated Stack Progress Bar -->
  <g transform="translate(24, 62)">
    <rect width="552" height="11" rx="5.5" fill="#1b1c30"/>
    <!-- Python: 44.0% = 242.8px -->
    <rect x="0" width="0" height="11" rx="5.5" fill="#38bdf8">
      <animate attributeName="width" from="0" to="242.8" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
    <!-- JavaScript: 28.5% = 157.3px -->
    <rect x="242.8" width="0" height="11" fill="#facc15">
      <animate attributeName="width" from="0" to="157.3" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
    <!-- React & UI: 14.5% = 80.0px -->
    <rect x="400.1" width="0" height="11" fill="#22d3ee">
      <animate attributeName="width" from="0" to="80.0" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
    <!-- HTML5 & CSS3: 8.5% = 47.0px -->
    <rect x="480.1" width="0" height="11" fill="#f97316">
      <animate attributeName="width" from="0" to="47.0" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
    <!-- Node & DB: 4.5% = 24.9px -->
    <rect x="527.1" width="0" height="11" rx="5.5" fill="#84cc16">
      <animate attributeName="width" from="0" to="24.9" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Language 1: Python -->
  <g transform="translate(24, 102)">
    <circle cx="10" cy="0" r="5.5" fill="#38bdf8"/>
    <text x="24" y="5" class="s" font-size="14" font-weight="700" fill="#f1f2fa">Python</text>
    <text x="82" y="4" class="m" font-size="11" fill="#6f738f">(Automation, Selenium, BeautifulSoup, ETL)</text>
    <text x="552" y="5" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#38bdf8">44.0%</text>
    <rect x="24" y="12" width="528" height="8" rx="4" fill="#1b1c30"/>
    <rect x="24" y="12" width="0" height="8" rx="4" fill="#38bdf8">
      <animate attributeName="width" from="0" to="232.3" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Language 2: JavaScript -->
  <g transform="translate(24, 148)">
    <circle cx="10" cy="0" r="5.5" fill="#facc15"/>
    <text x="24" y="5" class="s" font-size="14" font-weight="700" fill="#f1f2fa">JavaScript</text>
    <text x="108" y="4" class="m" font-size="11" fill="#6f738f">(ES6+, Web Apps, Logic, Dynamic UI)</text>
    <text x="552" y="5" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#facc15">28.5%</text>
    <rect x="24" y="12" width="528" height="8" rx="4" fill="#1b1c30"/>
    <rect x="24" y="12" width="0" height="8" rx="4" fill="#facc15">
      <animate attributeName="width" from="0" to="150.5" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Language 3: React.js -->
  <g transform="translate(24, 194)">
    <circle cx="10" cy="0" r="5.5" fill="#22d3ee"/>
    <text x="24" y="5" class="s" font-size="14" font-weight="700" fill="#f1f2fa">React.js</text>
    <text x="92" y="4" class="m" font-size="11" fill="#6f738f">(Component Architecture, Hooks, State)</text>
    <text x="552" y="5" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#22d3ee">14.5%</text>
    <rect x="24" y="12" width="528" height="8" rx="4" fill="#1b1c30"/>
    <rect x="24" y="12" width="0" height="8" rx="4" fill="#22d3ee">
      <animate attributeName="width" from="0" to="76.5" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Language 4: HTML5 & CSS3 -->
  <g transform="translate(24, 240)">
    <circle cx="10" cy="0" r="5.5" fill="#f97316"/>
    <text x="24" y="5" class="s" font-size="14" font-weight="700" fill="#f1f2fa">HTML5 &amp; CSS3</text>
    <text x="135" y="4" class="m" font-size="11" fill="#6f738f">(Semantic Markup, Flex, Grid, Responsive)</text>
    <text x="552" y="5" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#f97316">8.5%</text>
    <rect x="24" y="12" width="528" height="8" rx="4" fill="#1b1c30"/>
    <rect x="24" y="12" width="0" height="8" rx="4" fill="#f97316">
      <animate attributeName="width" from="0" to="44.8" dur="1.1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Language 5: Node.js & Database -->
  <g transform="translate(24, 286)">
    <circle cx="10" cy="0" r="5.5" fill="#84cc16"/>
    <text x="24" y="5" class="s" font-size="14" font-weight="700" fill="#f1f2fa">Node.js &amp; MongoDB</text>
    <text x="175" y="4" class="m" font-size="11" fill="#6f738f">(REST APIs, Express, Aggregations)</text>
    <text x="552" y="5" text-anchor="end" class="m" font-size="14" font-weight="700" fill="#84cc16">4.5%</text>
    <rect x="24" y="12" width="528" height="8" rx="4" fill="#1b1c30"/>
    <rect x="24" y="12" width="0" height="8" rx="4" fill="#84cc16">
      <animate attributeName="width" from="0" to="23.8" dur="1.1s" begin="1.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Bottom summary tag -->
  <text x="24" y="324" class="m" font-size="10.5" font-weight="500" fill="#8e91ab">STACK RATIO: 44% BACKEND &amp; AUTOMATION · 56% FRONTEND WEB APPS</text>

  <!-- Shimmer -->
  <g clip-path="url(#cardClip)">
    <rect class="shimmer" x="0" y="0" width="120" height="340" fill="url(#shg)"/>
  </g>
</svg>
