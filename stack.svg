<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Tech stack"><title>Tech stack</title><desc>Tech chips orbiting a code core, and a grouped grid: frontend, backend and data, automation, cloud and workflow.</desc><defs><style>
.s{font-family:'Space Grotesk','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-10deg)}}
@keyframes sweep{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes cycle{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes cycle2{0%,28%{opacity:0}33%,61%{opacity:1}66%,100%{opacity:0}}
@keyframes cycle3{0%,61%{opacity:0}66%,95%{opacity:1}100%{opacity:0}}
@keyframes swing{0%{transform:rotate(0)}30%{transform:rotate(7deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}

</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e16"/><stop offset="1" stop-color="#151628"/></linearGradient>
