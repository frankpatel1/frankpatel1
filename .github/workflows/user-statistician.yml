name: Generate GitHub Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate statistics
        uses: cicirello/user-statistician@v1
        with:
          user: frankpatel1
          output-path: images/userstats.svg
          custom-title: "Frank Patel's GitHub Statistics"
          animated-language-chart: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/userstats.svg
          git diff --cached --quiet || git commit -m "Update GitHub statistics"
          git push
