<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Frank Patel's GitHub Stats">
  <title>Frank Patel's GitHub Stats</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap');
      .s { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes rankPulse { 0%, 100% { opacity: .85; filter: drop-shadow(0 0 6px rgba(34,211,238,.6)); } 50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(34,211,238,.9)); } }
      @keyframes shineX { 0% { transform: translateX(-180px) skewX(-15deg); } 60%, 100% { transform: translateX(750px) skewX(-15deg); } }
      .rk-glow { animation: rankPulse 2.5s ease-in-out infinite; }
      .shimmer { animation: shineX 5s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#151628"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161828"/>
      <stop offset="100%" stop-color="#10111f"/>
    </linearGradient>
    <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="600" height="340" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="599" height="339" rx="18" fill="none" stroke="url(#grad)" stroke-opacity=".4" stroke-width="1.2"/>

  <!-- Window Header -->
  <rect width="600" height="42" rx="18" fill="#162338" fill-opacity=".5"/>
  <rect y="32" width="600" height="10" fill="#162338" fill-opacity=".5"/>
  <circle cx="26" cy="21" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="21" r="5" fill="#febc2e"/>
  <circle cx="58" cy="21" r="5" fill="#28c840"/>
  <text x="76" y="25" class="m" font-size="12" font-weight="700" fill="#22d3ee" letter-spacing="2">⚡ FRANK PATEL // GITHUB STATS</text>

  <!-- Metrics Column -->
  <!-- Stars -->
  <g transform="translate(24, 70)">
    <circle cx="14" cy="0" r="14" fill="#201d14"/>
    <text x="14" y="5" text-anchor="middle" font-size="13">⭐</text>
    <text x="40" y="5" class="s" font-size="14" font-weight="500" fill="#c9d1d9">Total Stars Earned:</text>
    <text x="330" y="5" text-anchor="end" class="m" font-size="15" font-weight="700" fill="#fde047">50+</text>
    <line x1="40" y1="18" x2="330" y2="18" stroke="#22253d" stroke-dasharray="3 3"/>
  </g>

  <!-- Commits -->
  <g transform="translate(24, 112)">
    <circle cx="14" cy="0" r="14" fill="#132338"/>
    <text x="14" y="5" text-anchor="middle" font-size="13">💻</text>
    <text x="40" y="5" class="s" font-size="14" font-weight="500" fill="#c9d1d9">Total Commits:</text>
    <text x="330" y="5" text-anchor="end" class="m" font-size="15" font-weight="700" fill="#7dd3fc">500+</text>
    <line x1="40" y1="18" x2="330" y2="18" stroke="#22253d" stroke-dasharray="3 3"/>
  </g>

  <!-- Public Repos -->
  <g transform="translate(24, 154)">
    <circle cx="14" cy="0" r="14" fill="#10251d"/>
    <text x="14" y="5" text-anchor="middle" font-size="13">📦</text>
    <text x="40" y="5" class="s" font-size="14" font-weight="500" fill="#c9d1d9">Public Repositories:</text>
    <text x="330" y="5" text-anchor="end" class="m" font-size="15" font-weight="700" fill="#4ade80">8+</text>
    <line x1="40" y1="18" x2="330" y2="18" stroke="#22253d" stroke-dasharray="3 3"/>
  </g>

  <!-- Followers -->
  <g transform="translate(24, 196)">
    <circle cx="14" cy="0" r="14" fill="#241838"/>
    <text x="14" y="5" text-anchor="middle" font-size="13">👥</text>
    <text x="40" y="5" class="s" font-size="14" font-weight="500" fill="#c9d1d9">Followers &amp; Network:</text>
    <text x="330" y="5" text-anchor="end" class="m" font-size="15" font-weight="700" fill="#c084fc">25+</text>
    <line x1="40" y1="18" x2="330" y2="18" stroke="#22253d" stroke-dasharray="3 3"/>
  </g>

  <!-- Production Web Apps -->
  <g transform="translate(24, 238)">
    <circle cx="14" cy="0" r="14" fill="#2d162d"/>
    <text x="14" y="5" text-anchor="middle" font-size="13">🚀</text>
    <text x="40" y="5" class="s" font-size="14" font-weight="500" fill="#c9d1d9">Production Web Apps:</text>
    <text x="330" y="5" text-anchor="end" class="m" font-size="15" font-weight="700" fill="#f472b6">6</text>
    <line x1="40" y1="18" x2="330" y2="18" stroke="#22253d" stroke-dasharray="3 3"/>
  </g>

  <!-- Hours Automated -->
  <g transform="translate(24, 280)">
    <circle cx="14" cy="0" r="14" fill="#132a35"/>
    <text x="14" y="5" text-anchor="middle" font-size="13">⏱️</text>
    <text x="40" y="5" class="s" font-size="14" font-weight="500" fill="#c9d1d9">Weekly Hours Automated:</text>
    <text x="330" y="5" text-anchor="end" class="m" font-size="15" font-weight="700" fill="#22d3ee">20+ hrs</text>
  </g>

  <!-- Bottom Badge -->
  <rect x="24" y="304" width="310" height="24" rx="6" fill="#131e33" stroke="#22d3ee" stroke-opacity=".25"/>
  <text x="34" y="320" class="m" font-size="10.5" font-weight="600" fill="#22d3ee" letter-spacing="1">⚡ SHIP FAST · AUTOMATE THE BORING</text>

  <!-- Circular Rank Ring Component -->
  <g transform="translate(480, 185)">
    <circle r="64" fill="none" stroke="#1d2138" stroke-width="9"/>
    <circle r="64" fill="none" stroke="url(#grad)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="402.1" stroke-dashoffset="330" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="402.1" to="80" dur="1.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </circle>
    <circle r="54" fill="#121324" stroke="#262842" stroke-width="1.5"/>
    <text class="s rk-glow" y="16" text-anchor="middle" font-size="44" font-weight="800" fill="#22d3ee">A+</text>
    <text class="m" y="40" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a78bfa" letter-spacing="2">GLOBAL RANK</text>
    <text class="m" y="86" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dd3fc">TOP COMMITS</text>
    <text class="s" y="102" text-anchor="middle" font-size="11" fill="#8e91ab">Consistently Active</text>
  </g>

  <!-- Shimmer -->
  <g clip-path="url(#cardClip)">
    <rect class="shimmer" x="0" y="0" width="120" height="340" fill="url(#shg)"/>
  </g>
</svg>