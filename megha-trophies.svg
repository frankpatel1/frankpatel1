<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="Frank Patel's GitHub Trophies">
  <title>Frank Patel's GitHub Trophies</title>
  <defs>
    <style><![CDATA[
      text { font-family: 'Space Grotesk', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes rankPulse { 0%, 100% { opacity: .8; filter: drop-shadow(0 0 3px currentColor); } 50% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); } }
      @keyframes shineX { 0% { transform: translateX(-200px) skewX(-15deg); } 60%, 100% { transform: translateX(1300px) skewX(-15deg); } }
      .rk { animation: rankPulse 2.2s ease-in-out infinite; }
      .sh { animation: shineX 5s ease-in-out 1.5s infinite; }
    ]]></style>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#151628"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17192d"/>
      <stop offset="100%" stop-color="#101121"/>
    </linearGradient>

    <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tc">
      <rect x="0" y="0" width="1092" height="168" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="1092" height="168" rx="14" fill="url(#bg)"/>

  <!-- ==================== TROPHY 1: AUTOMATOR ==================== -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="168" height="144" rx="14" fill="url(#cardGrad)" stroke="#ff7eb6" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="84" y="52" text-anchor="middle" font-size="30">⚡</text>
    <text class="rk" x="154" y="38" text-anchor="end" font-size="24" font-weight="800" fill="#ff7eb6">SSS</text>
    <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f2fa">Automator</text>
    <text class="m" x="84" y="110" text-anchor="middle" font-size="11" fill="#8e91ab">20+ hrs/wk saved</text>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#1e2038"/>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#ff7eb6">
      <animate attributeName="width" from="0" to="132" dur="1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- ==================== TROPHY 2: STARSTRUCK ==================== -->
  <g transform="translate(192, 12)">
    <rect x="0" y="0" width="168" height="144" rx="14" fill="url(#cardGrad)" stroke="#fde047" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="84" y="52" text-anchor="middle" font-size="30">🌟</text>
    <text class="rk" x="154" y="38" text-anchor="end" font-size="28" font-weight="800" fill="#fde047">S</text>
    <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f2fa">Starstruck</text>
    <text class="m" x="84" y="110" text-anchor="middle" font-size="11" fill="#8e91ab">Stars 50+</text>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#1e2038"/>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#fde047">
      <animate attributeName="width" from="0" to="132" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- ==================== TROPHY 3: PYTHON PRO ==================== -->
  <g transform="translate(372, 12)">
    <rect x="0" y="0" width="168" height="144" rx="14" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="84" y="52" text-anchor="middle" font-size="30">🐍</text>
    <text class="rk" x="154" y="38" text-anchor="end" font-size="24" font-weight="800" fill="#22d3ee">A+</text>
    <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f2fa">Python Pro</text>
    <text class="m" x="84" y="110" text-anchor="middle" font-size="11" fill="#8e91ab">ETL &amp; Scraping</text>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#1e2038"/>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#22d3ee">
      <animate attributeName="width" from="0" to="132" dur="1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- ==================== TROPHY 4: RISING STAR ==================== -->
  <g transform="translate(552, 12)">
    <rect x="0" y="0" width="168" height="144" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="84" y="52" text-anchor="middle" font-size="30">💜</text>
    <text class="rk" x="154" y="38" text-anchor="end" font-size="24" font-weight="800" fill="#c084fc">A+</text>
    <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f2fa">Rising Star</text>
    <text class="m" x="84" y="110" text-anchor="middle" font-size="11" fill="#8e91ab">Followers 25+</text>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#1e2038"/>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#c084fc">
      <animate attributeName="width" from="0" to="132" dur="1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- ==================== TROPHY 5: COMMITTER ==================== -->
  <g transform="translate(732, 12)">
    <rect x="0" y="0" width="168" height="144" rx="14" fill="url(#cardGrad)" stroke="#7dd3fc" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="84" y="52" text-anchor="middle" font-size="30">💻</text>
    <text class="rk" x="154" y="38" text-anchor="end" font-size="24" font-weight="800" fill="#7dd3fc">A+</text>
    <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f2fa">Committer</text>
    <text class="m" x="84" y="110" text-anchor="middle" font-size="11" fill="#8e91ab">Commits 500+</text>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#1e2038"/>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#7dd3fc">
      <animate attributeName="width" from="0" to="132" dur="1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- ==================== TROPHY 6: CREATOR ==================== -->
  <g transform="translate(912, 12)">
    <rect x="0" y="0" width="168" height="144" rx="14" fill="url(#cardGrad)" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="84" y="52" text-anchor="middle" font-size="30">📦</text>
    <text class="rk" x="154" y="38" text-anchor="end" font-size="28" font-weight="800" fill="#4ade80">A</text>
    <text x="84" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f2fa">Creator</text>
    <text class="m" x="84" y="110" text-anchor="middle" font-size="11" fill="#8e91ab">Repos 8+</text>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#1e2038"/>
    <rect x="18" y="122" width="132" height="5" rx="2.5" fill="#4ade80">
      <animate attributeName="width" from="0" to="132" dur="1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Light Sweep Effect -->
  <g clip-path="url(#tc)">
    <rect class="sh" x="0" y="0" width="140" height="168" fill="url(#shg)"/>
  </g>
</svg>