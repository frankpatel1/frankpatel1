<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" width="1280" height="180" role="img" aria-label="Frank Patel's GitHub Trophies">
  <title>Frank Patel's GitHub Trophies</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap');
      .s { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes popCell { 0% { opacity: 0; transform: translateY(12px) scale(.92); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes rankPulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
      @keyframes shineX2 { 0% { transform: translateX(-200px) skewX(-15deg); } 60%, 100% { transform: translateX(1360px) skewX(-15deg); } }
      .cell { opacity: 0; animation: popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards; transform-box: fill-box; transform-origin: center; }
      .rk { animation: rankPulse 2.2s ease-in-out infinite; }
      .sh2 { animation: shineX2 5s ease-in-out 1.5s infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#151628"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="trophyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17182b"/>
      <stop offset="100%" stop-color="#101121"/>
    </linearGradient>
    <linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".04"/>
    </pattern>
    <clipPath id="tc">
      <rect width="1280" height="180" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="180" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="180" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1279" height="179" rx="18" fill="none" stroke="url(#grad)" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- Header -->
  <text x="40" y="32" class="m" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="3">// GITHUB ACHIEVEMENTS &amp; RECOGNITION</text>

  <!-- Trophy Card 1: Automation Master -->
  <g class="cell" style="animation-delay:0.15s" transform="translate(40, 46)">
    <rect width="186" height="118" rx="14" fill="url(#trophyCard)" stroke="#f472b6" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="28" y="38" font-size="24">⚡</text>
    <text class="m rk" x="168" y="34" text-anchor="end" font-size="20" font-weight="800" fill="#f472b6">SSS</text>
    <text x="93" y="68" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#f4f5fb">Auto Master</text>
    <text x="93" y="86" text-anchor="middle" class="m" font-size="11" fill="#8e91ab">20+ hrs/wk saved</text>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#241740"/>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#f472b6">
      <animate attributeName="width" from="0" to="138" dur="1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Trophy Card 2: Starstruck -->
  <g class="cell" style="animation-delay:0.30s" transform="translate(242, 46)">
    <rect width="186" height="118" rx="14" fill="url(#trophyCard)" stroke="#fde047" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="28" y="38" font-size="24">🌟</text>
    <text class="m rk" x="168" y="34" text-anchor="end" font-size="20" font-weight="800" fill="#fde047">S</text>
    <text x="93" y="68" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#f4f5fb">Starstruck</text>
    <text x="93" y="86" text-anchor="middle" class="m" font-size="11" fill="#8e91ab">50+ Stars Earned</text>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#241740"/>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#fde047">
      <animate attributeName="width" from="0" to="138" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Trophy Card 3: Python Pioneer -->
  <g class="cell" style="animation-delay:0.45s" transform="translate(444, 46)">
    <rect width="186" height="118" rx="14" fill="url(#trophyCard)" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="28" y="38" font-size="24">🐍</text>
    <text class="m rk" x="168" y="34" text-anchor="end" font-size="20" font-weight="800" fill="#38bdf8">A+</text>
    <text x="93" y="68" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#f4f5fb">Python Pioneer</text>
    <text x="93" y="86" text-anchor="middle" class="m" font-size="11" fill="#8e91ab">ETL &amp; Scraping</text>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#241740"/>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#38bdf8">
      <animate attributeName="width" from="0" to="138" dur="1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Trophy Card 4: Committer -->
  <g class="cell" style="animation-delay:0.60s" transform="translate(646, 46)">
    <rect width="186" height="118" rx="14" fill="url(#trophyCard)" stroke="#7dd3fc" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="28" y="38" font-size="24">💻</text>
    <text class="m rk" x="168" y="34" text-anchor="end" font-size="20" font-weight="800" fill="#7dd3fc">A+</text>
    <text x="93" y="68" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#f4f5fb">Committer</text>
    <text x="93" y="86" text-anchor="middle" class="m" font-size="11" fill="#8e91ab">500+ Commits</text>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#241740"/>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#7dd3fc">
      <animate attributeName="width" from="0" to="138" dur="1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Trophy Card 5: Web Architect -->
  <g class="cell" style="animation-delay:0.75s" transform="translate(848, 46)">
    <rect width="186" height="118" rx="14" fill="url(#trophyCard)" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="28" y="38" font-size="24">🚀</text>
    <text class="m rk" x="168" y="34" text-anchor="end" font-size="20" font-weight="800" fill="#a78bfa">A</text>
    <text x="93" y="68" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#f4f5fb">Web Architect</text>
    <text x="93" y="86" text-anchor="middle" class="m" font-size="11" fill="#8e91ab">6+ Live Web Apps</text>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#241740"/>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#a78bfa">
      <animate attributeName="width" from="0" to="138" dur="1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Trophy Card 6: Repo Creator -->
  <g class="cell" style="animation-delay:0.90s" transform="translate(1050, 46)">
    <rect width="186" height="118" rx="14" fill="url(#trophyCard)" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="28" y="38" font-size="24">📦</text>
    <text class="m rk" x="168" y="34" text-anchor="end" font-size="20" font-weight="800" fill="#4ade80">A</text>
    <text x="93" y="68" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#f4f5fb">Repo Creator</text>
    <text x="93" y="86" text-anchor="middle" class="m" font-size="11" fill="#8e91ab">8+ Public Repos</text>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#241740"/>
    <rect x="24" y="98" width="138" height="4" rx="2" fill="#4ade80">
      <animate attributeName="width" from="0" to="138" dur="1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Shimmer -->
  <g clip-path="url(#tc)">
    <rect class="sh2" x="0" y="0" width="160" height="180" fill="url(#shg2)"/>
  </g>
</svg>
